server:
  port: 9000
---
logging:
  level:
    root:
    org:
      jline: off
      hibernate.orm.jdbc.bind: trace
---
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    version: "Booking app"

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME} #?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  flyway:
    enabled: true
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    locations: classpath:database/migrations
  #    ignore-migrations-patterns: repeatable:missing

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_updates: true
        order_inserts: true
        format_sql: true
        ddl-auto: none


  jwt:
    secretKey: ${JWT_SECRET}
    accessTokenExpiration: 900 # 5 M
    refreshTokenExpiration: 604800 # 7 Day

  main:
    banner-mode: off

  shell:
    interactive:
      enabled : true

  base:
    package: org.booking
    path: src/main/java/org/booking

springdoc:
  api-docs:
    enabled: false
---
stripe:
  secret_key: ${STRIPE_SANDBOX_SECRET_KEY}
  webhook_secret_key: ${STRIPE_WEBHOOK_SECRET_KEY}
#  publishable_key: ${STRIPE_SANDBOX_PUBLISHABLE_KEY}

file:
  upload:
    base=path: /Users/jobayer/Maven/booking/src/main/resources/files/
